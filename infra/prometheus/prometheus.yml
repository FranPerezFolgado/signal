global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lastfm-ingester
    static_configs:
      - targets: ["lastfm-ingester:9100"]

  - job_name: normalizer
    static_configs:
      - targets: ["normalizer:9100"]

  - job_name: enricher
    static_configs:
      - targets: ["enricher:9100"]

  - job_name: history-tracker
    static_configs:
      - targets: ["history-tracker:9100"]

  - job_name: novelty-detector
    static_configs:
      - targets: ["novelty-detector:9100"]

  - job_name: scorer
    static_configs:
      - targets: ["scorer:9100"]

  - job_name: artist-tracker
    static_configs:
      - targets: ["artist-tracker:9100"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
